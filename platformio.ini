; PlatformIO Project Configuration File for XiaoVault Survival Wiki
; https://docs.platformio.org/page/projectconf.html

[platformio]
default_envs = seeed_xiao_esp32c6
src_dir = src

; Common configuration across all ESP32 targets
[env]
platform = https://github.com/pioarduino/platform-espressif32/releases/download/stable/platform-espressif32.zip
framework = arduino
monitor_speed = 115200
upload_speed = 921600
lib_deps = 
    bblanchon/ArduinoJson @ ^7.0.4

; Target 1: Seeed Studio XIAO ESP32-C6 (Primary Target for XiaoVault Case)
[env:seeed_xiao_esp32c6]
board = esp32-c6-devkitc-1
board_build.mcu = esp32c6
board_build.f_cpu = 160000000L
build_flags = 
    -D CORE_DEBUG_LEVEL=1
    -D BOARD_XIAO_ESP32C6=1
    -D ARDUINO_USB_MODE=1
    -D ARDUINO_USB_CDC_ON_BOOT=1

; Target 2: Seeed Studio XIAO ESP32-S3
[env:seeed_xiao_esp32s3]
board = seeed_xiao_esp32s3
board_build.mcu = esp32s3
build_flags = 
    -D CORE_DEBUG_LEVEL=1
    -D BOARD_XIAO_ESP32S3=1
    -D ARDUINO_USB_MODE=1
    -D ARDUINO_USB_CDC_ON_BOOT=1

; Target 3: Generic ESP32 WROOM / DevKit
[env:esp32dev]
board = esp32dev
build_flags = 
    -D CORE_DEBUG_LEVEL=1
    -D BOARD_GENERIC_ESP32=1
